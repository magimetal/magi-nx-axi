name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  artifacts:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/magi-nx-axi dist/magi-nx-axi-${{ matrix.target }}
          shasum -a 256 dist/magi-nx-axi-${{ matrix.target }} > dist/magi-nx-axi-${{ matrix.target }}.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
